# Deploy satu klik ke Render (gratis): render.com -> New -> Blueprint -> pilih repo ini.
services:
  - type: web
    name: sempat
    runtime: docker
    plan: free
    healthCheckPath: /api/meta
    envVars:
      - key: SEMPAT_VAPID_PRIVATE   # isi dari: python -m backend.webpush
        sync: false
      - key: SEMPAT_PETUGAS_PASSWORD    # wajib diisi (min. 8 karakter); akun demo tidak aktif di server publik
        sync: false
      - key: SEMPAT_PERENCANA_PASSWORD  # wajib diisi (min. 8 karakter)
        sync: false
      - key: SEMPAT_PUSH_CONTACT
        value: mailto:tim-sempat@example.com
