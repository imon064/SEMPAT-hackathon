<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>SEMPAT — Petugas Lapangan</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/vendor/maplibre-gl.js" defer></script>
<script src="/static/vendor/qrcode.js" defer></script>
<script type="module" src="/static/js/petugas.js"></script>
</head>
<body>
<a class="sr-only" href="#root">Lewati ke isi utama</a>
<div class="app wide">
  <header class="statusbar">
    <span class="brand">SEMPAT · Petugas</span>
    <span id="areaName" class="small"></span>
    <span id="conn" role="status" aria-live="polite"><span class="dot off"></span>Menghubungkan…</span>
    <span id="who" class="small"></span>
  </header>
  <div id="banners"></div>
  <div id="modeBanner" class="mode-banner hidden" role="status" aria-live="assertive"></div>
  <div id="root"></div>
</div>

<template id="dashTpl">
  <div class="dash">
    <div class="side">
      <section class="card stack" id="alertCard" aria-live="polite"></section>

      <section class="card stack" aria-labelledby="capTitle">
        <div class="row"><h2 id="capTitle" class="grow" style="margin:0">Daya tampung &amp; alokasi</h2>
          <select id="capMode" aria-label="Jenis tujuan">
            <option value="aman">Shelter resmi + zona aman</option>
            <option value="gedung">Semua gedung layak + tanah tinggi</option>
          </select></div>
        <p class="small muted" style="margin:0">Penduduk model dialokasikan ke gedung tanpa melebihi kapasitas. Isi <strong>orang sudah di dalam</strong> agar kapasitas tersisa dihitung ulang.</p>
        <div id="capBody"></div>
      </section>

      <section class="card stack" aria-labelledby="ptTitle">
        <div class="row"><h2 id="ptTitle" class="grow" style="margin:0">Titik bantuan</h2>
          <button class="btn primary" data-act="addpoint" type="button">+ Tambah titik</button></div>
        <p class="small muted" style="margin:0">Perbarui status setiap ada perubahan. Warga hanya diarahkan ke titik yang <strong>buka dan belum penuh</strong>.</p>
        <div class="list" id="pointList"></div>
      </section>

      <section class="card stack" aria-labelledby="clTitle">
        <div class="row"><h2 id="clTitle" class="grow" style="margin:0">Jalan putus / terhalang</h2>
          <button class="btn" data-act="addclosure" type="button">Tandai di peta</button></div>
        <p class="small muted" style="margin:0">Ruas yang ditandai langsung dihindari oleh rute semua warga.</p>
        <div class="list" id="closureList"></div>
      </section>

      <section class="card stack" aria-labelledby="svTitle">
        <div class="row"><h2 id="svTitle" class="grow" style="margin:0">Gedung evakuasi vertikal</h2>
          <button class="btn" data-act="surveymode" type="button">Survei gedung di peta</button></div>
        <p class="small muted" style="margin:0">Data jumlah lantai dari peta sering kosong atau keliru. Survei Anda (lantai, struktur, akses) membuat warga hanya diarahkan ke gedung yang benar-benar layak saat tidak sempat ke tanah tinggi.</p>
        <div class="list" id="surveyList"></div>
      </section>

      <section class="card stack" id="demoCard">
        <h2 style="margin:0">Uji &amp; demo</h2>
        <div id="openPhone"></div>
        <p class="small muted" style="margin:0">Reset: cabut peringatan, hapus titik &amp; jalan putus buatan, pulihkan titik contoh.</p>
        <div class="row">
          <button class="btn" data-act="reset" type="button">Reset data demo</button>
          <a class="btn ghost" href="/" target="_blank" rel="noopener">Buka aplikasi warga ↗</a>
        </div>
      </section>
    </div>
    <div>
      <div id="map" class="map" role="application" aria-label="Peta wilayah. Ketuk untuk menaruh titik saat mode tambah aktif."></div>
      <!-- Legend: dinamis di dalam peta, mengikuti lapisan aktif (common.js createMap) -->
    </div>
  </div>
</template>
</body>
</html>
